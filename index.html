<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Joyful Holidays | Best Travel Agency in Salem</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;700;900&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
    font-family:'DM Sans',sans-serif;
    background:#fff;
}

/* NAV */
nav{
    position:fixed;
    width:100%;
    top:0;
    padding:15px 40px;
    display:flex;
    justify-content:space-between;
    background:#ffffffcc;
    backdrop-filter:blur(10px);
}

nav a{
    text-decoration:none;
    color:#333;
    margin-left:20px;
}

/* HERO */
.hero{
    height:100vh;
    background:url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:#fff;
}

.hero h1{
    font-size:50px;
    background:rgba(0,0,0,0.5);
    padding:20px;
}

/* SECTION */
section{
    padding:80px 40px;
    text-align:center;
}

.services{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    border:1px solid #ddd;
    padding:20px;
    border-radius:10px;
}

/* CONTACT */
.contact{
    background:#6a01b5;
    color:#fff;
}

.btn{
    display:inline-block;
    margin-top:15px;
    padding:10px 20px;
    background:#25D366;
    color:#fff;
    border-radius:8px;
    text-decoration:none;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
    <h3>The Joyful Holidays</h3>
    <div>
        <a href="#services">Services</a>
        <a href="#contact">Contact</a>
    </div>
</nav>

<!-- HERO -->
<div class="hero">
    <h1>Explore The World With Us 🌍</h1>
</div>

<!-- SERVICES -->
<section id="services">
    <h2>Our Services</h2>

    <div class="services">
        <div class="card">
            <h3>School Tours</h3>
            <p>Safe & educational tours for students.</p>
        </div>

        <div class="card">
            <h3>Trekking</h3>
            <p>Adventure trekking across South India.</p>
        </div>

        <div class="card">
            <h3>Camping</h3>
            <p>Memorable outdoor camping experiences.</p>
        </div>
    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
    <h2>Contact Us</h2>
    <p>📞 +91 7708666628</p>

    <a href="https://wa.me/917708666628" class="btn">
        <i class="fab fa-whatsapp"></i> WhatsApp Us
    </a>
</section>

</body>
</html>
